[package]
name = "kelir-backend"
version = "0.3.0"
edition = "2021"

[dependencies]
anyhow = "1"
# Argon2id password hashing (SRS NFR-SEC-001, coding standard 2.8).
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
# The JSON Logic evaluator behind JFSS calculate and conditional rules
# (FR-RAD-006, decision D-10). Pinned exactly, and to the same version as the
# frontend's @goplasmatic/datalogic-wasm: the two are one engine compiled for
# two runtimes, which is what makes Polyglot Parity a property that holds
# rather than one a test suite chases. A version bump is a parity-affecting
# change and moves on both sides together. Apache-2.0.
datalogic-rs = { version = "=5.2.0", features = ["serde_json"] }
# datalogic-rs evaluates into a bump arena, and a custom operator has to
# allocate its result there.
bumpalo = "3"
# JWT access tokens (architecture 01 section 18.1).
jsonwebtoken = "9"
rand = "0.8"
# Refresh tokens are stored as a SHA-256 digest, never in the clear.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reports which field a deserialization error came from. serde_json alone says
# only what went wrong, so a type error could not name the field it was on and
# the envelope had nothing to put in ValidationDetail.path.
serde_path_to_error = "0.1"
# "log" bridges sqlx's statement logging into tracing; "migrate" provides the
# embedded migration runner; uuid/chrono map the BASE columns.
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1", features = ["full"] }
# CORS only: the browser refuses cross-origin replies from the Vite dev server
# without it, and the frontend and API are separate origins in every environment.
tower-http = { version = "0.6", features = ["cors"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }
# JSON Schema validation of stored JFSS form definitions (FR-RAD-002, #156).
# All references in the meta-schema are internal (`#/$defs/...`), so no
# resolver feature is enabled: a validator that can fetch a remote schema is a
# validator that can be pointed at one.
jsonschema = { version = "0.51.0", default-features = false }
# SMTP delivery for the one transactional email the product sends: the
# password-reset link (FR-AUTH-006, #17). Locally that is mailpit, which the
# compose stack already runs.
#
# `default-features = false` deliberately: the default pulls `native-tls`, and
# every other TLS user in this crate is rustls (see the sqlx feature list
# above). Two TLS stacks in one binary is two certificate stores to configure
# and two sets of failures to diagnose.
#
# **This is not the notification module.** Phase 6 owns templates, channels,
# retries and the outbox; this sends one message directly, which is the
# smallest thing that makes the reset flow real rather than logged.
lettre = { version = "0.11.23", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls",
    "tokio1-rustls-tls",
    "builder",
] }

[dev-dependencies]
# Integration tests drive the API against a real PostgreSQL.
serde_urlencoded = "0.7"
# Drives the router in tests via ServiceExt::oneshot, without binding a port.
tower = { version = "0.5", features = ["util"] }
