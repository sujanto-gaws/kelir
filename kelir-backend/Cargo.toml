[package]
name = "kelir-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "log" bridges sqlx's statement logging into tracing; "migrate" provides the
# embedded migration runner; uuid/chrono map the BASE columns.
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1", features = ["full"] }
# CORS only: the browser refuses cross-origin replies from the Vite dev server
# without it, and the frontend and API are separate origins in every environment.
tower-http = { version = "0.6", features = ["cors"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
# Drives the router in tests via ServiceExt::oneshot, without binding a port.
tower = { version = "0.5", features = ["util"] }
