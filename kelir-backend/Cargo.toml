[package]
name = "kelir-backend"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
# Argon2id password hashing (SRS NFR-SEC-001, coding standard 2.8).
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
# JWT access tokens (architecture 01 section 18.1).
jsonwebtoken = "9"
rand = "0.8"
# Refresh tokens are stored as a SHA-256 digest, never in the clear.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "log" bridges sqlx's statement logging into tracing; "migrate" provides the
# embedded migration runner; uuid/chrono map the BASE columns.
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1", features = ["full"] }
# CORS only: the browser refuses cross-origin replies from the Vite dev server
# without it, and the frontend and API are separate origins in every environment.
tower-http = { version = "0.6", features = ["cors"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
# Integration tests drive the API against a real PostgreSQL.
serde_urlencoded = "0.7"
# Drives the router in tests via ServiceExt::oneshot, without binding a port.
tower = { version = "0.5", features = ["util"] }
