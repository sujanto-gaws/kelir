name: CI

# The gates that make a pull request mergeable (git workflow section 4):
# fmt, clippy, backend tests, frontend lint + type-check + tests, and builds.
#
# `pull_request` carries no branch filter, deliberately. It read
# `branches: [main]`, which is correct only where every pull request targets
# main -- and a branch split for reviewability does not. Both of Sprint 5's
# stacked pull requests sat green-untested until their base merged and they
# were retargeted, and the second also carried a defect the missing run would
# have caught: the migration went into the base pull request and the test its
# rows break into the stacked one, so the base failed CI on a test that was
# already fixed one commit away.
#
# The cost is that a stacked pull request is tested twice -- once against its
# base and again after retargeting -- which is the point rather than a waste:
# rebasing onto a moved base is where composition defects hide, and this
# project has already lost a release rehearsal to one.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kelir-backend

    # sqlx's query! macros verify every SQL statement against a real schema at
    # compile time (coding standard 2.5), so the build needs a database — not
    # only the tests.
    #
    # The committed `cargo sqlx prepare` output in kelir-backend/.sqlx exists for
    # the release image, which has no database and could not be built at all
    # without it. This job used to argue against committing that cache because it
    # goes stale silently; the "Offline query cache is current" step below is the
    # answer to that, and it is why the cache can be trusted.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kelir
          POSTGRES_PASSWORD: kelir
          POSTGRES_DB: kelir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kelir -d kelir"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kelir:kelir@localhost:5432/kelir
      KELIR_STORAGE_ENDPOINT: http://localhost:9000
      KELIR_STORAGE_BUCKET: kelir-test
      KELIR_STORAGE_ACCESS_KEY: minioadmin
      KELIR_STORAGE_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v7

      # Attachments put bytes in object storage and the integration tests read
      # them back out of it (#244). The harness's rule is that nothing is mocked
      # — it already requires the postgres above for the same reason — so a real
      # S3 endpoint is what the attachment tests run against. An in-memory double
      # would verify the double.
      #
      # **A step and not a service container**, which is the one thing this
      # cannot be: a service container takes an image and no command, and
      # `minio/minio` needs `server /data`. Given none it prints its usage and
      # exits, the health check never passes, and the job fails in
      # *Initialize containers* before a line of Rust is compiled.
      #
      # **The bucket is created here and not by the application.** The backend
      # holds credentials that put and get objects in a bucket; a process that
      # can create buckets can create the one an attacker names.
      # `deploy/docker`'s `minio-init` service does the same thing for the
      # compose stack.
      - name: Start object storage and create its bucket
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "until mc alias set ci http://localhost:9000 minioadmin minioadmin; \
             do sleep 1; done \
             && mc mb --ignore-existing ci/kelir-test"

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kelir-backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('kelir-backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Apply migrations
        # Applied with psql, which the runner already has, rather than by
        # installing sqlx-cli — that compiles from source and would add minutes
        # to every run for the same result. The macros need the schema, not the
        # _sqlx_migrations bookkeeping; the binary still creates that at startup.
        run: |
          for migration in migrations/*.sql; do
            echo "applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration"
          done

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Offline query cache is current
        # The release image builds with SQLX_OFFLINE=true against the committed
        # .sqlx directory, so a query added or changed without re-running
        # `cargo sqlx prepare -- --all-targets` makes the image unbuildable. That
        # happened: the backend image last built during Phase 1 and was broken by
        # the first identity queries, unnoticed for two releases because the
        # release step that consumes the image was never performed.
        #
        # Compiling against the cache rather than running `sqlx prepare --check`
        # keeps sqlx-cli out of CI, which compiles from source and would add
        # minutes to every run. A missing entry fails here; a stale leftover
        # entry is harmless.
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --all-targets

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kelir-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kelir-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Evaluator is off the first-load path
        # Decision D-10 accepted ~596 KB gzipped of WebAssembly on one condition
        # -- only a page that renders a form pays it -- and no unit test can
        # observe a chunk graph. This reads the manifest the build above wrote.
        # It runs after Build for that reason and cannot run without it.
        run: npm run check:bundle

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest

    # It drives the release stack, not a dev server (decision D-14, issue #153).
    # That is the whole point and it is also the whole cost: this job builds both
    # release images from scratch, so it is the slowest in the pipeline by a wide
    # margin. The alternative — pointing a browser at `vite dev` — would exercise
    # a bundle nobody ships and a proxy nobody deploys.
    #
    # It runs on the same trigger as the frontend job (issue #153 AC1) rather
    # than on a schedule: a browser check that runs after the merge tells you
    # about a defect that is already on main.

    # PostgreSQL is not part of the deployed stack — the staging compose file
    # addresses a database outside it, because that is how the real host runs
    # (a native install, so the NFR-AVA-004 restore drill exercises something
    # real). A service container published on the runner is that same shape:
    # the backend container reaches it through host.docker.internal, which the
    # compose file already maps to the bridge gateway.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kelir
          POSTGRES_PASSWORD: ci-only-database-password-6Qb2xR
          POSTGRES_DB: kelir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kelir -d kelir"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Not secrets: this stack exists for the length of one job, is reachable
      # from nothing but the runner, and is destroyed with it. Held in the
      # workflow rather than in repository secrets so a fork's pull request can
      # run the job at all — a check that silently does not run on forks is
      # worse than one that runs with a throwaway password.
      KELIR_E2E_USERNAME: admin
      KELIR_E2E_PASSWORD: ci-only-bootstrap-password-4Tz9wK
      KELIR_E2E_BASE_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the harness
        working-directory: e2e
        run: npm ci

      - name: Type check
        # Playwright transpiles TypeScript without type-checking it, so a spec
        # that does not compile still runs — and fails at whatever line the
        # missing type would have named. Checking here means a type error is a
        # type error, before a stack is built to discover it.
        working-directory: e2e
        run: npm run type-check

      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Configure the deployment
        # deploy.sh reads this file, refuses placeholder secrets in it, and
        # compose interpolates the same file. KELIR_DB_HOST is left at its
        # default (host.docker.internal) because that is where the service
        # container's published port is reachable from inside the stack.
        run: |
          cat > deploy/staging/.env <<'ENVFILE'
          KELIR_DB_PASSWORD=ci-only-database-password-6Qb2xR
          KELIR_JWT_SECRET=ci-only-jwt-secret-Xr4Lm8Qp2ZvT6Ns1
          KELIR_MINIO_USER=ci-only-minio-user
          KELIR_MINIO_PASSWORD=ci-only-minio-password-9Hd3Bs
          KELIR_TRUSTED_PROXY_HOPS=1
          KELIR_BOOTSTRAP_ADMIN_USERNAME=admin
          KELIR_BOOTSTRAP_ADMIN_PASSWORD=ci-only-bootstrap-password-4Tz9wK
          KELIR_BOOTSTRAP_ADMIN_EMAIL=admin@localhost
          ENVFILE

      - name: Bring the release stack up
        # The version has to be the one the binary reports, because deploy.sh
        # smoke-tests /version against it and fails when the wrong image is
        # running. Reading it from Cargo.toml keeps that true across a release
        # bump without a second place to edit.
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' kelir-backend/Cargo.toml | head -1)"
          echo "deploying ${version} for the browser flow"
          cd deploy/staging
          KELIR_HOST_IP=127.0.0.1 ./deploy-local.sh "${version}" 8080

      - name: Drive the flow
        working-directory: e2e
        run: npm test

      - name: Stack logs
        if: failure()
        # KELIR_VERSION is re-derived rather than carried over: the compose file
        # makes it required, and a diagnostic step that fails to interpolate is
        # a diagnostic missing exactly when it is wanted.
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' kelir-backend/Cargo.toml | head -1)"
          cd deploy/staging
          KELIR_VERSION="${version}" docker compose -f docker-compose.staging.yml logs --tail 200

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    # Only meaningful on pull requests: the branch's commits are checked against
    # the commit message convention before they can be squashed onto main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate headers against the commit convention
        run: |
          ./scripts/check-commit-messages.sh \
            "origin/${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}"
