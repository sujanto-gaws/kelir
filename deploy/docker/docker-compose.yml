services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../../bhuvarloka-frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      - VITE_BHUVARLOKA_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - backend

  backend:
    image: rust:1.89
    working_dir: /app
    volumes:
      - ../../bhuvarloka-backend:/app
    command: sh -c "cargo run"
    ports:
      - "8080:8080"
    environment:
      - BHUVARLOKA_APP_NAME=Bhuvarloka
      - BHUVARLOKA_APP_ENV=development
      - BHUVARLOKA_DATABASE_URL=postgres://postgres:postgres@postgres:5432/bhuvarloka
      - BHUVARLOKA_JWT_SECRET=change-me
      - BHUVARLOKA_STORAGE_DRIVER=local
      - BHUVARLOKA_SMTP_HOST=mailpit
      - BHUVARLOKA_FRONTEND_URL=http://localhost:5173
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bhuvarloka
    ports:
      - "5432:5432"
    volumes:
      - bhuvarloka-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  bhuvarloka-postgres-data:
