services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../../kelir-frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "${KELIR_FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_KELIR_API_BASE_URL=http://localhost:${KELIR_BACKEND_PORT:-8080}/api/v1
    depends_on:
      - backend

  backend:
    image: rust:1.89
    working_dir: /app
    volumes:
      - ../../kelir-backend:/app
    command: sh -c "cargo run"
    ports:
      - "${KELIR_BACKEND_PORT:-8080}:8080"
    environment:
      - KELIR_APP_NAME=Kelir
      - KELIR_APP_ENV=development
      - KELIR_DATABASE_URL=postgres://postgres:postgres@postgres:5432/kelir
      - KELIR_JWT_SECRET=change-me
      - KELIR_STORAGE_DRIVER=local
      - KELIR_SMTP_HOST=mailpit
      - KELIR_FRONTEND_URL=http://localhost:5173
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kelir
    ports:
      - "${KELIR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - kelir-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "${KELIR_MINIO_PORT:-9000}:9000"
      - "${KELIR_MINIO_CONSOLE_PORT:-9001}:9001"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${KELIR_SMTP_PORT:-1025}:1025"
      - "${KELIR_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  kelir-postgres-data:
