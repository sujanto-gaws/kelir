services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../../kelir-frontend:/app
      # Keep node_modules inside the container. The host tree is mounted over
      # /app, and host and container install different platform binaries; a
      # shared node_modules corrupts whichever ran second.
      - kelir-frontend-node-modules:/app/node_modules
    # npm ci, not npm install: install rewrites package-lock.json, and the
    # container's npm drops metadata the host's npm writes, so every run left
    # the committed lock file modified.
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "${KELIR_FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_KELIR_API_BASE_URL=http://localhost:${KELIR_BACKEND_PORT:-8080}/api/v1
    depends_on:
      - backend

  backend:
    image: rust:1.89
    working_dir: /app
    volumes:
      - ../../kelir-backend:/app
      # Same reason as the frontend: host and container build for different
      # targets into the same target/, so each invalidates the other's cache.
      # A named volume also keeps the container's build cache across restarts.
      - kelir-backend-target:/app/target
    command: sh -c "cargo run"
    ports:
      - "${KELIR_BACKEND_PORT:-8080}:8080"
    environment:
      - KELIR_APP_NAME=Kelir
      - KELIR_APP_ENV=development
      - KELIR_DATABASE_URL=postgres://postgres:postgres@postgres:5432/kelir
      - KELIR_JWT_SECRET=change-me
      - KELIR_STORAGE_DRIVER=local
      # Attachments (FR-ATT-001, #244). The service name resolves inside the
      # compose network; `minio-init` below creates the bucket, because the
      # backend holds credentials that can put and get objects and deliberately
      # not ones that can create a bucket.
      - KELIR_STORAGE_ENDPOINT=http://minio:9000
      - KELIR_STORAGE_BUCKET=kelir
      - KELIR_STORAGE_ACCESS_KEY=minioadmin
      - KELIR_STORAGE_SECRET_KEY=minioadmin
      # 25 MB, and the same number the scanner is sized against (#245, #246).
      - KELIR_STORAGE_MAX_UPLOAD_BYTES=26214400
      # The scanner (FR-ATT-001, #246). There is no switch that turns scanning
      # off: an unreachable scanner leaves every attachment PENDING and
      # therefore undownloadable, which is the direction this has to fail in.
      - KELIR_CLAMAV_HOST=clamav
      - KELIR_CLAMAV_PORT=3310
      - KELIR_SMTP_HOST=mailpit
      # The container port, which is fixed; KELIR_SMTP_PORT in the environment
      # moves the host mapping only, and must not follow it in here.
      - KELIR_SMTP_PORT=1025
      - KELIR_MAIL_FROM=no-reply@kelir.local
      - KELIR_FRONTEND_URL=http://localhost:5173
    depends_on:
      - postgres
      - minio-init
      - clamav

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kelir
    ports:
      - "${KELIR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - kelir-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "${KELIR_MINIO_PORT:-9000}:9000"
      - "${KELIR_MINIO_CONSOLE_PORT:-9001}:9001"

  # One shot: creates the bucket and exits. **The application does not create
  # it** — a process that can create buckets can create the one an attacker
  # names, and the backend is given credentials for putting and getting objects
  # in a bucket somebody else provisioned. MinIO has been in this stack since
  # Sprint 0 with nothing using it; #244 is what puts the first byte in it.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: sh
    # One physical line: a folded scalar keeps more-indented lines literal, so a
    # split `command` arrives as several shell commands. See the staging stack,
    # where that shipped and the exit demo found it.
    #
    # **It ends by checking what it was for** — the Sprint 12 retrospective's
    # second action. `mc mb` is not evidence that a bucket exists: a shell that
    # cannot find a command still exits 0 if the last one succeeded, which is
    # exactly how this container reported success while creating nothing. The
    # trailing `mc ls kelir/kelir` fails loudly when the bucket is absent, so
    # `depends_on` and a person reading `docker compose ps` both learn it.
    command: -c "until mc alias set kelir http://minio:9000 minioadmin minioadmin; do sleep 1; done && mc mb --ignore-existing kelir/kelir && mc ls kelir/kelir"

  # Reserved by the system design since 2026-08-11 and filled by #246. **Sized
  # 2026-08-31 rather than guessed**: ~1 GB resident, almost all of it the
  # signature set, 25 MiB scanned in ~169 ms, and no gain from concurrency — so
  # one instance is the whole answer. It ships its own database, so it is ready
  # about 20 seconds after start rather than after a freshclam download.
  #
  # **`StreamMaxLength` must stay strictly above KELIR_STORAGE_MAX_UPLOAD_BYTES.**
  # clamd's own sample config documents 25M, which is exactly the upload limit;
  # at that value every maximum-size upload is refused by the scanner, recorded
  # FAILED and permanently undownloadable. This image's effective default is
  # 100 MiB, which is why nothing is set here.
  clamav:
    image: clamav/clamav:latest
    ports:
      - "${KELIR_CLAMAV_PORT:-3310}:3310"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${KELIR_SMTP_PORT:-1025}:1025"
      - "${KELIR_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  kelir-postgres-data:
  kelir-frontend-node-modules:
  kelir-backend-target:
