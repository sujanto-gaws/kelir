services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../../kelir-frontend:/app
      # Keep node_modules inside the container. The host tree is mounted over
      # /app, and host and container install different platform binaries; a
      # shared node_modules corrupts whichever ran second.
      - kelir-frontend-node-modules:/app/node_modules
    # npm ci, not npm install: install rewrites package-lock.json, and the
    # container's npm drops metadata the host's npm writes, so every run left
    # the committed lock file modified.
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "${KELIR_FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_KELIR_API_BASE_URL=http://localhost:${KELIR_BACKEND_PORT:-8080}/api/v1
    depends_on:
      - backend

  backend:
    image: rust:1.89
    working_dir: /app
    volumes:
      - ../../kelir-backend:/app
      # Same reason as the frontend: host and container build for different
      # targets into the same target/, so each invalidates the other's cache.
      # A named volume also keeps the container's build cache across restarts.
      - kelir-backend-target:/app/target
    command: sh -c "cargo run"
    ports:
      - "${KELIR_BACKEND_PORT:-8080}:8080"
    environment:
      - KELIR_APP_NAME=Kelir
      - KELIR_APP_ENV=development
      - KELIR_DATABASE_URL=postgres://postgres:postgres@postgres:5432/kelir
      - KELIR_JWT_SECRET=change-me
      - KELIR_STORAGE_DRIVER=local
      # Attachments (FR-ATT-001, #244). The service name resolves inside the
      # compose network; `minio-init` below creates the bucket, because the
      # backend holds credentials that can put and get objects and deliberately
      # not ones that can create a bucket.
      - KELIR_STORAGE_ENDPOINT=http://minio:9000
      - KELIR_STORAGE_BUCKET=kelir
      - KELIR_STORAGE_ACCESS_KEY=minioadmin
      - KELIR_STORAGE_SECRET_KEY=minioadmin
      # 25 MB, and the same number the scanner is sized against (#245, #246).
      - KELIR_STORAGE_MAX_UPLOAD_BYTES=26214400
      # The scanner (FR-ATT-001, #246). There is no switch that turns scanning
      # off: an unreachable scanner leaves every attachment PENDING and
      # therefore undownloadable, which is the direction this has to fail in.
      - KELIR_CLAMAV_HOST=clamav
      - KELIR_CLAMAV_PORT=3310
      - KELIR_SMTP_HOST=mailpit
      # The container port, which is fixed; KELIR_SMTP_PORT in the environment
      # moves the host mapping only, and must not follow it in here.
      - KELIR_SMTP_PORT=1025
      - KELIR_MAIL_FROM=no-reply@kelir.local
      - KELIR_FRONTEND_URL=http://localhost:5173
      # The first-run administrator, read from a `.env` beside this file the way
      # every port above is. **The staging compose file has passed these since
      # the release stack was first run and this one never did**, so a developer
      # who followed the quick start got a stack that migrated, warned that
      # nobody could sign in, and served an application no one could enter --
      # the same fault, in the shape that is hit far more often.
      #
      # Empty is not a placeholder here: `config.rs` trims and discards blank
      # values, so an unset pair is read as *no bootstrap configured* and the
      # stack starts exactly as it did before. The bootstrap is a no-op once any
      # user exists, so leaving them set costs nothing but the password sitting
      # in a file -- which is why the quick start says to clear them afterwards.
      - KELIR_BOOTSTRAP_ADMIN_USERNAME=${KELIR_BOOTSTRAP_ADMIN_USERNAME:-}
      - KELIR_BOOTSTRAP_ADMIN_PASSWORD=${KELIR_BOOTSTRAP_ADMIN_PASSWORD:-}
      - KELIR_BOOTSTRAP_ADMIN_EMAIL=${KELIR_BOOTSTRAP_ADMIN_EMAIL:-}
    # **The long form, because the short one waits for the wrong thing** (#359).
    # `depends_on: [minio-init]` waits for that container to *start*; it says
    # nothing about whether it succeeded. `minio-init` ends by checking what it
    # was for — `mc ls kelir/kelir`, the Sprint 12 retrospective's second action
    # — and a postcondition nobody observes is a postcondition that does not
    # fail anything. So a stack whose bucket step failed still came up, still
    # answered `/health/ready`, and still failed at the first upload.
    #
    # `service_started` is what the short form already meant for the other two,
    # written out so the difference between them is on the page rather than in
    # the reader's memory of compose's defaults.
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kelir
    ports:
      - "${KELIR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - kelir-postgres-data:/var/lib/postgresql/data

  # **Pinned, like the language runtimes are** (**D-62**). PostgreSQL, Rust and
  # Node have been pinned since Sprint 0; the four infrastructure images this
  # phase added were `:latest`, in this file and in the one CI deploys — so two
  # deployments of one Kelir tag could run different object storage and a
  # different scanner, and a `docker compose pull` could change the product
  # without changing the repository. Raised by the Sprint 13 independent pass,
  # finding 3.
  #
  # **Every pin below is the image `latest` resolved to on 2026-09-03**, by
  # digest, so this change froze the stack rather than moving it.
  #
  # **Two of the four have no version line.** MinIO and `mc` publish only
  # `RELEASE.<timestamp>` and `latest`, so they take a dated release and a bump
  # is a deliberate edit. ClamAV and Mailpit have patch lines — `1.5`, `v1.31` —
  # which is the granularity `postgres:16` already uses.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "${KELIR_MINIO_PORT:-9000}:9000"
      - "${KELIR_MINIO_CONSOLE_PORT:-9001}:9001"

  # One shot: creates the bucket and exits. **The application does not create
  # it** — a process that can create buckets can create the one an attacker
  # names, and the backend is given credentials for putting and getting objects
  # in a bucket somebody else provisioned. MinIO has been in this stack since
  # Sprint 0 with nothing using it; #244 is what puts the first byte in it.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: sh
    # One physical line: a folded scalar keeps more-indented lines literal, so a
    # split `command` arrives as several shell commands. See the staging stack,
    # where that shipped and the exit demo found it.
    #
    # **It ends by checking what it was for** — the Sprint 12 retrospective's
    # second action. `mc mb` is not evidence that a bucket exists: a shell that
    # cannot find a command still exits 0 if the last one succeeded, which is
    # exactly how this container reported success while creating nothing. The
    # trailing `mc ls kelir/kelir` fails loudly when the bucket is absent, so
    # `depends_on` and a person reading `docker compose ps` both learn it.
    command: -c "until mc alias set kelir http://minio:9000 minioadmin minioadmin; do sleep 1; done && mc mb --ignore-existing kelir/kelir && mc ls kelir/kelir"

  # Reserved by the system design since 2026-08-11 and filled by #246. **Sized
  # 2026-08-31 rather than guessed**: ~1 GB resident, almost all of it the
  # signature set, 25 MiB scanned in ~169 ms, and no gain from concurrency — so
  # one instance is the whole answer. It ships its own database, so it is ready
  # about 20 seconds after start rather than after a freshclam download.
  #
  # **`StreamMaxLength` is set here, and it is set strictly above
  # `KELIR_STORAGE_MAX_UPLOAD_BYTES`** (#324). The two numbers are one
  # relationship: the backend refuses an upload over 25 MiB, and clamd must
  # accept everything the backend accepted — a stream clamd refuses comes back
  # as an error, the attachment is recorded `FAILED`, and `FAILED` is refused at
  # download exactly as `INFECTED` is, so a file nobody can scan is a file
  # nobody can retrieve. **32M gives the larger number ~28% of headroom**, which
  # is room for the protocol rather than for a larger file; raising the upload
  # limit means raising this with it.
  #
  # **It used to be unset, and that was a decision resting on somebody else's
  # default.** clamd's own sample config documents `StreamMaxLength 25M` —
  # commented out, so a compiled-in default applies — and 25M is *exactly* the
  # upload limit, at which every maximum-size upload is refused by the scanner.
  # This image's effective default is far above that (measured: 25 MiB clears),
  # so nothing was broken; what was missing was this project having chosen.
  # **D-62**'s pin stopped that default moving underneath a deployment, which is
  # as far as a pin can close it.
  #
  # `CLAMD_CONF_<Setting>` is the image's own mechanism: its entrypoint
  # uncomments the matching line in `clamd.conf`, so this is the documented
  # setting rather than a mounted file that would have to reproduce every other
  # default the image ships.
  clamav:
    image: clamav/clamav:1.5
    environment:
      - CLAMD_CONF_StreamMaxLength=32M
    ports:
      - "${KELIR_CLAMAV_PORT:-3310}:3310"

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${KELIR_SMTP_PORT:-1025}:1025"
      - "${KELIR_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  kelir-postgres-data:
  kelir-frontend-node-modules:
  kelir-backend-target:
