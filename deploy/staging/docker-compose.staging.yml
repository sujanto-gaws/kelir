# Staging stack — kelir-staging-01, serving https://staging.kelir.gawshub.com
#
# Differs from the development stack in three ways that matter:
#
#   1. It runs released images by tag, never source mounts. Deploys are
#      `KELIR_VERSION=v0.1.0 docker compose up -d` — the same immutable
#      artifacts that go to production (release process §4 step 8).
#   2. Only Caddy publishes ports. Object storage and mail are reachable only on
#      the internal network, and PostgreSQL runs natively on the host rather
#      than in a container — its data directory is an ordinary host path, so the
#      NFR-AVA-004 restore drill is a real exercise. provision-ubuntu-24.sh
#      installs it, restricts pg_hba to the Docker address pool, and keeps
#      PostgreSQL off the firewall's open ports.
#   3. Secrets come from the environment, never from this file. The backend
#      refuses to start in staging on a placeholder JWT secret.
#
# Usage on the host:
#   cd /opt/kelir && cp .env.staging.example .env && $EDITOR .env
#   KELIR_VERSION=0.1.0 docker compose -f docker-compose.staging.yml up -d

name: kelir-staging

services:
  caddy:
    image: kelir-frontend:${KELIR_VERSION:?set KELIR_VERSION to the release being deployed}
    restart: unless-stopped
    ports:
      # Defaults are the real deployment. Local testing by IP overrides
      # KELIR_HTTP_PORT and reaches the stack at http://<host-ip>:<port>.
      - '${KELIR_HTTP_PORT:-80}:80'
      - '${KELIR_HTTPS_PORT:-443}:443'
    environment:
      # Consumed by the Caddyfile. A bare port such as :8080 serves plain HTTP;
      # a hostname triggers automatic TLS.
      KELIR_SITE_ADDRESS: ${KELIR_SITE_ADDRESS:-staging.kelir.gawshub.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates and ACME state — losing this re-issues
      - caddy-config:/config
    depends_on:
      - backend

  backend:
    image: kelir-backend:${KELIR_VERSION:?set KELIR_VERSION to the release being deployed}
    restart: unless-stopped
    environment:
      KELIR_APP_NAME: Kelir
      # staging by default; deploy-local.sh sets development, because the
      # placeholder-secret rule that protects an internet-facing host is only
      # friction on a laptop.
      KELIR_APP_ENV: ${KELIR_APP_ENV:-staging}
      KELIR_BIND_ADDRESS: 0.0.0.0:8080
      # host.docker.internal resolves to the Docker bridge gateway via the
      # extra_hosts entry below, which is how a container reaches a service
      # listening on the host.
      # Host and port are configurable because PostgreSQL is not part of this
      # stack: the defaults address the host's native install over the Docker
      # bridge, but a test rig may run it elsewhere or on another port.
      KELIR_DATABASE_URL: postgres://kelir:${KELIR_DB_PASSWORD:?set KELIR_DB_PASSWORD}@${KELIR_DB_HOST:-host.docker.internal}:${KELIR_DB_PORT:-5432}/kelir
      KELIR_JWT_SECRET: ${KELIR_JWT_SECRET:?set KELIR_JWT_SECRET to a generated value}
      KELIR_STORAGE_DRIVER: s3
      # **Object storage, addressed inside the stack** (#244). Without these the
      # defaults point at `localhost:9000` *inside the backend container*, where
      # nothing listens — so every upload failed and the minio service beside it
      # held nothing. Found by the Sprint 12 exit demo, which is what an exit
      # demo is for: no unit or integration test can see a deployment's wiring.
      KELIR_STORAGE_ENDPOINT: http://minio:9000
      KELIR_STORAGE_BUCKET: kelir
      KELIR_STORAGE_ACCESS_KEY: ${KELIR_MINIO_USER:?set KELIR_MINIO_USER}
      KELIR_STORAGE_SECRET_KEY: ${KELIR_MINIO_PASSWORD:?set KELIR_MINIO_PASSWORD}
      # **The scanner** (#246). Absent from this stack until 2026-08-31, which
      # meant every attachment stayed PENDING and nothing was ever downloadable
      # — the safe direction, and not a working product.
      KELIR_CLAMAV_HOST: clamav
      KELIR_CLAMAV_PORT: 3310
      KELIR_SMTP_HOST: mailpit
      KELIR_SMTP_PORT: 1025
      # Staging sends to mailpit, so the sender is never delivered anywhere real.
      # A deployment that relays for a domain must own the address it sends from.
      KELIR_MAIL_FROM: ${KELIR_MAIL_FROM:-no-reply@staging.kelir.gawshub.com}
      # Single origin: the browser only ever talks to the Caddy address, so this
      # is used for redirects and links rather than for CORS.
      KELIR_FRONTEND_URL: ${KELIR_PUBLIC_URL:-https://staging.kelir.gawshub.com}
      # Caddy is the only hop, and no backend port is published, so the last
      # entry Caddy writes into X-Forwarded-For is the real caller. Raising this
      # without adding a real proxy hands callers control of their own address.
      KELIR_TRUSTED_PROXY_HOPS: ${KELIR_TRUSTED_PROXY_HOPS:-1}
      # The first-run administrator. Without these a fresh deployment migrates
      # its database, warns that nobody can sign in, and serves an application
      # no one can enter -- which is what it did, unnoticed, until the release
      # stack was actually run for the first time. They are read from .env and
      # left empty on a deployment that already has users; the bootstrap is a
      # no-op once any user exists.
      KELIR_BOOTSTRAP_ADMIN_USERNAME: ${KELIR_BOOTSTRAP_ADMIN_USERNAME:-}
      KELIR_BOOTSTRAP_ADMIN_PASSWORD: ${KELIR_BOOTSTRAP_ADMIN_PASSWORD:-}
      KELIR_BOOTSTRAP_ADMIN_EMAIL: ${KELIR_BOOTSTRAP_ADMIN_EMAIL:-}
      KELIR_LOG: info,sqlx=warn
    # Docker does not provide host.docker.internal on Linux by default; this
    # maps it to the bridge gateway so the same URL works on every platform.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # There is no depends_on for PostgreSQL because it is not a compose service.
    # The backend runs migrations at startup and exits if the database is not
    # reachable; the restart policy retries until it is.
    #
    # **`minio-init` is a dependency, and it was not one at all until #359.**
    # That container creates the attachment bucket and ends by checking what it
    # was for; nothing here waited for it, so a stack whose bucket step failed
    # came up, answered `/health/ready`, and failed at the first upload — the
    # Sprint 13 retrospective's fifth action, open since it was written.
    # `service_completed_successfully` is the condition that makes the
    # postcondition mean something.
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # **Pinned, like the language runtimes are** (**D-62**). PostgreSQL, Rust and
  # Node have been pinned since Sprint 0; the four infrastructure images this
  # phase added were `:latest`, in this file and in the one CI deploys — so two
  # deployments of one Kelir tag could run different object storage and a
  # different scanner, and a `docker compose pull` could change the product
  # without changing the repository. Raised by the Sprint 13 independent pass,
  # finding 3.
  #
  # **Every pin below is the image `latest` resolved to on 2026-09-03**, by
  # digest, so this change froze the stack rather than moving it.
  #
  # **Two of the four have no version line.** MinIO and `mc` publish only
  # `RELEASE.<timestamp>` and `latest`, so they take a dated release and a bump
  # is a deliberate edit. ClamAV and Mailpit have patch lines — `1.5`, `v1.31` —
  # which is the granularity `postgres:16` already uses.
  #
  # **The release Dockerfiles are held more strictly** (#590): every `FROM`
  # names a release (a patch-level or dated tag, or a digest), not a line,
  # because the image built from it is what a Kelir tag ships. The images in
  # this file still name lines, which the pin test accepts for compose files.
  minio:
    image: ghcr.io/sujanto-gaws/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${KELIR_MINIO_USER:?set KELIR_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${KELIR_MINIO_PASSWORD:?set KELIR_MINIO_PASSWORD}
      # **The store key** (NFR-SEC-009, ADR-0049): every object is encrypted
      # under it (SSE-S3), and so is MinIO's own configuration. It lives in
      # `.env` and nowhere in an image or the `minio-data` volume. Losing it
      # loses the store's contents; the Installation guide §8 says what brings
      # them back.
      MINIO_KMS_SECRET_KEY: ${KELIR_MINIO_KMS_SECRET_KEY:?set KELIR_MINIO_KMS_SECRET_KEY; the Installation guide §6.3 generates one}
    volumes:
      - minio-data:/data

  # One shot: creates the bucket the backend expects, makes it encrypt by
  # default, re-encrypts anything stored before the key, and exits. **The
  # application does not create the bucket** — a process that can create
  # buckets can create the one an attacker names — so the deployment
  # provisions it, exactly as `deploy/docker` and CI's backend job do. The
  # development compose file runs the same script.
  minio-init:
    image: ghcr.io/sujanto-gaws/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${KELIR_MINIO_USER:?set KELIR_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${KELIR_MINIO_PASSWORD:?set KELIR_MINIO_PASSWORD}
    # **The script is one argument to `bash -c`, in a literal block.** Until
    # #778 it was one physical line, because a *folded* scalar keeps
    # more-indented lines literal, and a `command` split that way arrived as
    # several shell commands: the bucket was never created and every upload
    # answered `NoSuchBucket` (the Sprint 12 exit demo). A literal block (`|`)
    # as one list item keeps every newline and is still one argument. `$$` is
    # compose's escape for a `$` the shell is to see.
    #
    # **It ends by checking what it was for**: that the bucket encrypts by
    # default, and that no object is left unencrypted. A one-shot container
    # that fails is one somebody sees, and the backend waits for this one.
    #
    # **The re-encrypt pass is the upgrade from a store without a key** (#778,
    # AC6). It rewrites through the S3 API, by a server-side copy onto itself,
    # each object MinIO does not report as SSE-S3, soft-deleted ones included.
    # The copy gives the object a new modification time and may give it a new
    # ETag; Kelir reads neither. After one complete pass it finds nothing.
    entrypoint: [bash, -c]
    command:
      - |
        set -euo pipefail
        until mc alias set kelir http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null; do sleep 1; done
        mc mb --ignore-existing kelir/kelir
        mc encrypt set sse-s3 kelir/kelir > /dev/null
        [[ "$$(mc encrypt info --json kelir/kelir)" == *'"algorithm":"AES256"'* ]] \
          || { echo "minio-init: kelir/kelir does not encrypt by default" >&2; exit 1; }
        unencrypted() {
          local listing stats line pattern='"name":"kelir/([^"\\]+)"'
          listing="$$(mc ls --recursive --json kelir/kelir)"
          [[ -n "$$listing" ]] || return 0
          stats="$$(mc stat --recursive --json kelir/kelir)"
          while IFS= read -r line; do
            [[ "$$line" == *'"status":"success"'* && "$$line" =~ $$pattern ]] \
              || { echo "minio-init: cannot read an object's state: $$line" >&2; return 1; }
            [[ "$$line" == *'"X-Amz-Server-Side-Encryption":"AES256"'* ]] || printf '%s\n' "$${BASH_REMATCH[1]}"
          done <<< "$$stats"
        }
        started=$$SECONDS
        rewritten=0
        keys="$$(unencrypted)"
        while IFS= read -r key; do
          [[ -n "$$key" ]] || continue
          mc cp --quiet --enc-s3 kelir/kelir "kelir/kelir/$$key" "kelir/kelir/$$key" > /dev/null
          rewritten=$$((rewritten + 1))
        done <<< "$$keys"
        remaining="$$(unencrypted)"
        [[ -z "$$remaining" ]] || { echo "minio-init: still unencrypted: $$remaining" >&2; exit 1; }
        echo "minio-init: kelir/kelir encrypts by default; re-encrypted $$rewritten object(s) in $$((SECONDS - started))s"

  # The virus scanner (#246, **D-4**). **Sized 2026-08-31 rather than guessed**:
  # ~1 GB resident, almost all of it the signature set, 25 MiB scanned in
  # ~169 ms, and no gain from concurrency — one instance is the whole answer.
  #
  # **`StreamMaxLength` is set here, and strictly above
  # `KELIR_STORAGE_MAX_UPLOAD_BYTES`** (#324). The development compose carries
  # the full reasoning; the short of it is that clamd must accept everything the
  # backend accepted, because a stream clamd refuses is recorded `FAILED` and
  # `FAILED` is refused at download exactly as `INFECTED` is. Raising the upload
  # limit means raising this with it.
  clamav:
    image: ghcr.io/sujanto-gaws/clamav:1.5.4
    environment:
      CLAMD_CONF_StreamMaxLength: 32M
    restart: unless-stopped

  # Staging captures mail rather than sending it, so testing notifications in
  # Phase 6 cannot reach real recipients. Its UI is deliberately not published —
  # reach it over an SSH tunnel.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped

volumes:
  minio-data:
  caddy-data:
  caddy-config:
